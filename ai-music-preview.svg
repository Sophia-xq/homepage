<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">AI music generation system project preview</title>
  <desc id="desc">A product-style preview showing natural language prompts becoming multi-track MIDI music.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7f4ef"/>
      <stop offset="48%" stop-color="#d8e7df"/>
      <stop offset="100%" stop-color="#f8d6cc"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#172226"/>
      <stop offset="100%" stop-color="#0d8f83"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#16211f" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="960" height="720" fill="url(#bg)"/>
  <circle cx="792" cy="136" r="88" fill="#e66b55" opacity=".78"/>
  <circle cx="164" cy="590" r="116" fill="#0d8f83" opacity=".16"/>
  <g filter="url(#shadow)">
    <rect x="92" y="74" width="776" height="572" rx="28" fill="#fff" opacity=".96"/>
  </g>
  <g transform="translate(132 118)">
    <text x="0" y="0" dominant-baseline="hanging" fill="#173033" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="900">AI Music Generation</text>
    <text x="0" y="54" fill="#68716d" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Natural language prompt to multi-track MIDI</text>
    <rect x="0" y="96" width="696" height="104" rx="18" fill="#f0ebe3" stroke="#d8d2c8" stroke-width="2"/>
    <text x="28" y="128" fill="#0d8f83" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="900">Prompt</text>
    <text x="28" y="166" fill="#172226" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">欢快的钢琴独奏，适合春天的郊游</text>
    <g transform="translate(0 246)">
      <rect width="214" height="236" rx="18" fill="#173033"/>
      <text x="24" y="36" fill="#42d9c7" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900">01 Text Understanding</text>
      <path d="M28 86h128M28 122h158M28 158h96" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".72"/>
      <circle cx="164" cy="176" r="18" fill="#e66b55"/>
    </g>
    <g transform="translate(242 246)">
      <rect width="214" height="236" rx="18" fill="url(#panel)"/>
      <text x="24" y="36" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900">02 Symbolic Music</text>
      <g stroke="#fff" stroke-width="3" opacity=".78">
        <path d="M28 92h154M28 124h154M28 156h154M28 188h154"/>
      </g>
      <g fill="#ffd166">
        <circle cx="62" cy="124" r="10"/>
        <rect x="70" y="78" width="6" height="48" rx="3"/>
        <circle cx="128" cy="156" r="10"/>
        <rect x="136" y="110" width="6" height="48" rx="3"/>
      </g>
    </g>
    <g transform="translate(484 246)">
      <rect width="214" height="236" rx="18" fill="#f0ebe3" stroke="#d8d2c8" stroke-width="2"/>
      <text x="24" y="36" fill="#e66b55" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900">03 Multi-track MIDI</text>
      <rect x="28" y="78" width="148" height="20" rx="10" fill="#0d8f83"/>
      <rect x="28" y="116" width="104" height="20" rx="10" fill="#e66b55"/>
      <rect x="28" y="154" width="166" height="20" rx="10" fill="#173033"/>
      <rect x="28" y="192" width="122" height="20" rx="10" fill="#42d9c7"/>
    </g>
    <path d="M214 364h28M456 364h28" stroke="#173033" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
